<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>status page</title>
</head>

<body>
  <style>
    * {
      background-color: black;
      color: white;
      font-family: MS PGothic;
      margin: 0;
      padding: 0;
    }

    body {
      div {
        margin: 0 10em 12em;

        h1 {
          font-size: 4em;
          margin-bottom: 0.5em;
        }

        div {
          display: flex;
          flex-wrap: wrap;

          margin: 0;
          gap: 1em;


          div {
            display: block;

            flex-grow: 0;
            flex-shrink: 0;

            width: 16em;
            height: 8em;
            padding: 1em;

            span {
              font-size: 0.75em;
              overflow: hidden;
            }
          }

          .online {
            border: solid white 1px;

            h3 {
              color: greenyellow;
            }

            span {
              color: greenyellow;
            }
          }

          .offline {
            border: solid gray 1px;

            h2 {
              color: darkslategray;
            }

            h3 {
              color: darkslategray;
            }

            span {
              color: darkslategray;
            }
          }
        }
      }
    }
  </style>

  <canvas id="contours"></canvas>

  <div>
    <h1>status</h1>
    <div id="servers">
      <!-- <div class="online">
        <h2>nuvo</h2>
        <h3><span>●</span> online</h3>
      </div>

      <div class="offline">
        <h2>.31.125</h2>
        <h3><span>○</span> offline</h3>
      </div>

      <div class="offline">
        <h2>.31.169</h2>
        <h3><span>○</span> offline</h3>
      </div> -->
    </div>
  </div>

  <script>
    const serversDiv = document.querySelector("#servers");

    const hosts = ["192.168.31.125", "192.168.31.169", "192.168.31.1"];

    for (const host of hosts) {
      const status = (Math.random() > 0.5) ? "online" : "offline";

      const serverDiv = document.createElement("div");
      {
        const serverName = document.createElement("h2");
        serverName.textContent = host;
        serverDiv.appendChild(serverName);

        const statusText = document.createElement("h3");
        {
          const statusIcon = document.createElement("span");
          statusIcon.textContent = status == "online" ? "●" : "○";
          statusText.appendChild(statusIcon);
          statusText.append(status);
        }
        serverDiv.appendChild(statusText);
      }
      serverDiv.className += ` ${status}`;
      serversDiv.appendChild(serverDiv);
    }
  </script>

  <script>
    const canvas = document.querySelector("#contours");
    const ctx = canvas.getContext("2d");

    function resize() {
      canvas.width = innerWidth * devicePixelRatio;
      canvas.height = 200 * devicePixelRatio;
      canvas.style.width = `${innerWidth}px`;
      canvas.style.minHeight = "200px";
      ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    }
    resize();
    addEventListener("resize", resize);

    function displacement(x, y, time) {
      // Broad, smooth waves
      let d =
        18 * Math.sin(x * 0.006 + y * 0.012 + time) +
        10 * Math.sin(x * 0.013 - y * 0.008 - time * 0.7) +
        5 * Math.sin(x * 0.027 + y * 0.018);

      // Localized folds / disturbances
      const disturbances = [
        [0.18, 0.46, 55],
        [0.43, 0.31, -48],
        [0.67, 0.68, 45],
        [0.90, 0.37, -60]
      ];

      for (const [px, py, strength] of disturbances) {
        const dx = x - px * innerWidth;
        const dy = y - py * 500;
        const radius = 150;

        d += strength *
          Math.exp(-(dx * dx + dy * dy) / (radius * radius)) *
          Math.sin(dx * 0.018);
      }

      return d;
    }

    function draw(timestamp) {
      const time = timestamp * 0.00015;

      ctx.fillStyle = "#050609";
      ctx.fillRect(0, 0, innerWidth, 500);

      const gradient = ctx.createLinearGradient(0, 0, innerWidth, 0);
      gradient.addColorStop(0, "#a55cff");
      gradient.addColorStop(0.5, "#718cff");
      gradient.addColorStop(1, "#55d8ff");

      ctx.strokeStyle = gradient;
      ctx.lineWidth = 0.85;

      const spacing = 9;

      for (let baseY = -80; baseY < 580; baseY += spacing) {
        ctx.beginPath();

        for (let x = 0; x <= innerWidth; x += 4) {
          const y = baseY + displacement(x, baseY, time);

          if (x === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }

        ctx.stroke();
      }

      requestAnimationFrame(draw);
    }

    requestAnimationFrame(draw);
  </script>
</body>

</html>
